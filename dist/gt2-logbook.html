<title>GT 2 Logbook</title>
<meta name="description" content="Activity, workouts, sleep and heart data from a Huawei Watch GT 2.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112.5,600;112.5,700;112.5,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>/* GT 2 Logbook
   Layout: a left-aligned training log — sticky header with tabs, one filter row,
   then summary-before-detail sections on a cool map-paper plane. Cards only where
   an element must stand apart. */
:root {
  --bg: #f4f6f7;
  --surface: #ffffff;
  --surface-2: #eef1f3;
  --ink: #111c24;
  --ink-2: #4a5964;
  --muted: #6b7883;
  --hair: #e2e7ea;
  --line: #cbd3d8;
  --accent: #b4235a;
  --accent-ink: #ffffff;
  --accent-wash: rgba(180, 35, 90, 0.08);
  --focus: #b4235a;

  /* data */
  --run: #2a78d6;
  --walk: #eb6834;
  --ride: #1baf7a;
  --other: #98a3ab;
  --steps: #008300;
  --heart: #e34948;
  --sleep: #6a5ad9;
  --spo2: #2a78d6;
  --stress: #eda100;
  --deep: #30238a;
  --light: #6a5ad9;
  --rem: #a79ef0;
  --awake: #eda100;
  --heat-0: #e6f2e3;
  --heat-1: #b5dcab;
  --heat-2: #74bd68;
  --heat-3: #2f962f;
  --heat-4: #0b5e10;
  /* diverging pair (polarity: fatigue ↔ fresh, negative ↔ positive), gray midpoint */
  --div-cool: #3b6fb6;
  --div-warm: #d0612f;
  --div-mid: #e6e9ec;
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --critical: #d03b3b;

  /* map background (OpenStreetMap data): quiet neutrals so routes stand out */
  --map-land: #eef1f3;
  --map-water: #b9d3e6;
  --map-water-label: #3a6b8f;
  --map-park: #d9e8d1;
  --map-wood: #c9dcc0;
  --map-pitch: #e1ebd8;
  --map-road: #ffffff;
  --map-road-major: #fffaf0;
  --map-casing: #cfd6db;
  --map-path: #9aa5ad;
  --map-rail: #a4adb4;
  --map-label: #46555f;
  --map-halo: rgba(246, 248, 249, 0.92);

  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
  --radius-sm: 6px;
  --gutter: clamp(16px, 4vw, 40px);
  --maxw: 1240px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1417;
    --surface: #161d21;
    --surface-2: #1d262b;
    --ink: #e9eef1;
    --ink-2: #b3c0c8;
    --muted: #8a97a0;
    --hair: #253038;
    --line: #34414a;
    --accent: #f0679a;
    --accent-ink: #1a0a10;
    --accent-wash: rgba(240, 103, 154, 0.12);
    --focus: #f0679a;
    --run: #3987e5;
    --walk: #d95926;
    --ride: #199e70;
    --other: #5f6b73;
    --steps: #36a83b;
    --heart: #e66767;
    --sleep: #8a7ff0;
    --spo2: #3987e5;
    --stress: #c98500;
    --deep: #5546c9;
    --light: #8a7ff0;
    --rem: #c4bdf8;
    --awake: #c98500;
    --heat-0: #1b3220;
    --heat-1: #22512a;
    --heat-2: #2e7a34;
    --heat-3: #44a54a;
    --heat-4: #86d98a;
    --good-text: #3fbf3f;
    --div-cool: #5b8fd6;
    --div-warm: #d8733f;
    --div-mid: #2a3237;
    --map-land: #182027;
    --map-water: #1f3b52;
    --map-water-label: #84b5da;
    --map-park: #1d2f25;
    --map-wood: #1f3427;
    --map-pitch: #233229;
    --map-road: #2f3a44;
    --map-road-major: #3b4752;
    --map-casing: #10161b;
    --map-path: #5e6c76;
    --map-rail: #58656e;
    --map-label: #b3c0c8;
    --map-halo: rgba(15, 20, 24, 0.9);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0f1417;
  --surface: #161d21;
  --surface-2: #1d262b;
  --ink: #e9eef1;
  --ink-2: #b3c0c8;
  --muted: #8a97a0;
  --hair: #253038;
  --line: #34414a;
  --accent: #f0679a;
  --accent-ink: #1a0a10;
  --accent-wash: rgba(240, 103, 154, 0.12);
  --focus: #f0679a;
  --run: #3987e5;
  --walk: #d95926;
  --ride: #199e70;
  --other: #5f6b73;
  --steps: #36a83b;
  --heart: #e66767;
  --sleep: #8a7ff0;
  --spo2: #3987e5;
  --stress: #c98500;
  --deep: #5546c9;
  --light: #8a7ff0;
  --rem: #c4bdf8;
  --awake: #c98500;
  --heat-0: #1b3220;
  --heat-1: #22512a;
  --heat-2: #2e7a34;
  --heat-3: #44a54a;
  --heat-4: #86d98a;
  --good-text: #3fbf3f;
  --div-cool: #5b8fd6;
  --div-warm: #d8733f;
  --div-mid: #2a3237;
  --map-land: #182027;
  --map-water: #1f3b52;
  --map-water-label: #84b5da;
  --map-park: #1d2f25;
  --map-wood: #1f3427;
  --map-pitch: #233229;
  --map-road: #2f3a44;
  --map-road-major: #3b4752;
  --map-casing: #10161b;
  --map-path: #5e6c76;
  --map-rail: #58656e;
  --map-label: #b3c0c8;
  --map-halo: rgba(15, 20, 24, 0.9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* Elements hidden with the attribute stay hidden whatever their display (the app build has no publisher stylesheet to do this). */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.num, table { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------------ shell */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--hair);
}
.topbar-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: 10px 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.brand-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 26px; height: 26px; flex: none; }
.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-stretch: 112.5%;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
.brand .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 2px 10px; font-size: 12px; color: var(--ink-2); background: var(--surface);
  white-space: nowrap;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip.ok .dot { background: var(--good); }
.chip.warn .dot { background: var(--warning); }
.chip.bad .dot { background: var(--critical); }
.chip.sample { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }

.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: none; padding: 10px 12px 11px; cursor: pointer;
  font-family: var(--font-display); font-stretch: 112.5%; font-weight: 600;
  font-size: 12.5px; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap;
  text-decoration: none;
}
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main {
  max-width: var(--maxw);
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: 18px 64px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ------------------------------------------------------------------ filter row */
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button {
  border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--ink-2); border-right: 1px solid var(--hair);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.range-label { color: var(--ink-2); font-size: 13px; }
.custom-range { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); }
.custom-range input { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--surface); }
.fam-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.fam-chip {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; background: var(--surface); color: var(--ink-2);
}
.fam-chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
.fam-chip .key { width: 10px; height: 10px; border-radius: 3px; }

/* ------------------------------------------------------------------ sections */
.view { display: flex; flex-direction: column; gap: 26px; }
.section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section h2, .section-title {
  margin: 0; font-family: var(--font-display); font-stretch: 112.5%; font-weight: 700;
  font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink);
  text-wrap: balance;
}
.section .note { margin: 0; color: var(--muted); font-size: 12.5px; }
.grid { display: grid; gap: 22px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.span-12 { grid-column: span 12; }
.span-8 { grid-column: span 8; }
.span-7 { grid-column: span 7; }
.span-6 { grid-column: span 6; }
.span-5 { grid-column: span 5; }
.span-4 { grid-column: span 4; }
@media (max-width: 900px) {
  .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; }
}
.panel {
  background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius);
  padding: 16px; min-width: 0;
}
.chart-title { margin: 0 0 2px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.chart-sub { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis text, .chart text.lbl { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.chart .axis path, .chart .axis line { stroke: var(--line); }
.chart .grid line { stroke: var(--hair); }
.chart text.val { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
.chart text.halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; fill: var(--ink-2); }
.wlist td { white-space: normal; vertical-align: top; }
.wlist td:first-child { width: 52px; }
.wlist td.r { min-width: 92px; }
.split-track { width: 140px; max-width: 30vw; }
.chart .empty-msg { fill: var(--muted); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend .ln { width: 14px; height: 2px; border-radius: 1px; }

/* ------------------------------------------------------------------ hero + tiles */
.hero { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 24px; align-items: center; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.dial { width: 100%; max-width: 300px; aspect-ratio: 1; margin: 0 auto; }
.dial svg { width: 100%; height: 100%; display: block; }
.dial .big { fill: var(--ink); font-family: var(--font-ui); font-weight: 600; }
.dial .small { fill: var(--muted); font-size: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 12px; }
.tile {
  background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius);
  padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.tile .label { font-size: 12px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.tile .label .key { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tile .value { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; }
.tile .value small { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
.tile .delta { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; min-height: 18px; }
.tile .delta.up-good, .tile .delta.down-good { color: var(--good-text); }
.tile .delta.up-bad, .tile .delta.down-bad { color: var(--critical); }
.tile .spark { height: 28px; margin-top: 4px; }

/* ------------------------------------------------------------------ tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--hair); border-radius: var(--radius); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--hair); white-space: nowrap; }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; background: var(--surface); position: sticky; top: 0; }
th button { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; color: inherit; font-size: inherit; }
th[aria-sort="ascending"] button::after { content: " ↑"; }
th[aria-sort="descending"] button::after { content: " ↓"; }
td.r, th.r { text-align: right; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
.sport-cell { display: inline-flex; align-items: center; gap: 8px; }
.sport-cell .key { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.thumb { width: 44px; height: 30px; display: block; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; background: var(--surface-2); color: var(--ink-2); }
.badge.accent { background: var(--accent-wash); color: var(--accent); }

/* ------------------------------------------------------------------ controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 13px;
  text-decoration: none;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 50%, var(--line)); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.field label { color: var(--ink-2); font-size: 12px; font-weight: 500; }
.field input, .field select, textarea {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); min-width: 0;
}
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.dropzone {
  border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 22px; text-align: center;
  background: var(--surface); display: flex; flex-direction: column; gap: 10px; align-items: center;
}
.dropzone.over { border-color: var(--accent); background: var(--accent-wash); }
.dropzone p { margin: 0; color: var(--ink-2); }
.progress { width: 100%; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }
.msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; border: 1px solid var(--hair); background: var(--surface); }
.msg.err { border-color: color-mix(in srgb, var(--critical) 45%, var(--hair)); }
.msg.ok { border-color: color-mix(in srgb, var(--good) 45%, var(--hair)); }
.msg strong { display: block; margin-bottom: 2px; }
.banner {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  border: 1px solid var(--accent); background: var(--accent-wash); border-radius: var(--radius); padding: 12px 16px;
}
.banner p { margin: 0; }
.steps-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; color: var(--ink-2); }
.steps-list b { color: var(--ink); font-weight: 600; }
details.guide { border-top: 1px solid var(--hair); padding-top: 10px; }
details.guide summary { cursor: pointer; font-weight: 600; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

/* ------------------------------------------------------------------ workout detail */
.detail-head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.detail-head h2 { margin: 0; font-family: var(--font-display); font-stretch: 112.5%; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em; }
.stat-row { display: flex; flex-wrap: wrap; gap: 12px 28px; }
.stat { display: flex; flex-direction: column; }
.stat .k { font-size: 12px; color: var(--ink-2); }
.stat .v { font-size: 20px; font-weight: 600; }
.stat .v small { font-size: 12px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.route { width: 100%; aspect-ratio: 4 / 3; max-height: 460px; background: var(--surface-2); border-radius: var(--radius); }
.route svg { width: 100%; height: 100%; display: block; }

/* ------------------------------------------------------------------ ask */
.chat { display: flex; flex-direction: column; gap: 12px; }
.bubble { max-width: 72ch; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.me { align-self: flex-end; background: var(--ink); color: var(--bg); }
.bubble.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--hair); }
.bubble.ai.thinking { color: var(--muted); }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; }
.suggest button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.suggest button:hover { color: var(--ink); border-color: var(--ink-2); }
.ask-form { display: flex; gap: 8px; align-items: flex-end; }
.ask-form textarea { flex: 1; resize: vertical; min-height: 44px; max-height: 200px; }
.tool-note { font-size: 12px; color: var(--muted); }

/* ------------------------------------------------------------------ tooltip */
.tip {
  position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12); max-width: 260px; display: none;
}
.tip .t-title { color: var(--ink-2); margin-bottom: 4px; }
.tip .t-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .t-row .t-k { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip .t-row .t-v { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .t-key { width: 12px; height: 2px; border-radius: 1px; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 60; font-size: 13px;
  max-width: calc(100vw - 32px); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
}
.empty-state { text-align: left; padding: 28px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--ink-2); background: var(--surface); }
